# Production deployment pipeline. Runs only through an approval-required Cloud Build trigger on main,
# as the dedicated deployer service account. Deploys the commit being built (COMMIT_SHA) as a no-traffic candidate revision,
# verifies the candidate through its tagged URL, and only then promotes it to 100% of traffic.
substitutions:
  _REGION: us-east1
  _SERVICE: cicdagent-sample-demo
  _READY_PATH: /ready
  _DEPLOYER: cicd-deployer@${PROJECT_ID}.iam.gserviceaccount.com
  _IMAGE: us-east1-docker.pkg.dev/${PROJECT_ID}/cicdagent-images/sample

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    name: node:22-slim
    dir: app
    entrypoint: npm
    args: ["test"]

  - id: audit
    name: node:22-slim
    dir: app
    entrypoint: npm
    args: ["audit", "--audit-level=high"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${COMMIT_SHA}", "app"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${COMMIT_SHA}"]

  - id: deploy-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --set-env-vars=APP_VERSION=${COMMIT_SHA}
      - --no-allow-unauthenticated
      - --no-traffic
      - --tag=candidate
      - --quiet

  - id: verify-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        url=$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')
        cand=$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format=json | python3 -c "import sys,json; print(next(t['url'] for t in json.load(sys.stdin)['status']['traffic'] if t.get('tag')=='candidate'))")
        echo "candidate url: $$cand"
        TOKEN=$$(gcloud auth print-identity-token --impersonate-service-account=${_DEPLOYER} --audiences="$$url") \
          bash scripts/check-ready.sh "$$cand" "${_READY_PATH}" "${COMMIT_SHA}"

  - id: promote
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run services update-traffic ${_SERVICE} --region=${_REGION} --to-tags=candidate=100 --quiet
        gcloud run services update-traffic ${_SERVICE} --region=${_REGION} --remove-tags=candidate --quiet

  - id: verify-live
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        url=$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')
        TOKEN=$$(gcloud auth print-identity-token --impersonate-service-account=${_DEPLOYER} --audiences="$$url") \
          bash scripts/check-ready.sh "$$url" "${_READY_PATH}" "${COMMIT_SHA}"
